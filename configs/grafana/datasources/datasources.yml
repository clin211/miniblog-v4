apiVersion: 1

# Grafana 数据源配置
datasources:
  # Tempo - 分布式追踪数据源
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    apiVersion: 1
    jsonData:
      tracesToLogsV2:
        # 关联日志到追踪（如果有 Loki）
        enabled: false
      tracesToMetrics:
        # 关联追踪到指标
        enabled: true
        datasourceUid: victoria-metrics
        queries:
          - name: Sampled Rate
            query: sum(rate(http_server_requests_total{service="blog-apiserver"}[$__rate_interval])) by (le)
        tags:
          - key: service.name
            value: service
        tagsField: service.name
      serviceMap:
        datasourceUid: victoria-metrics
      nodeGraph:
        enabled: true
    isDefault: false

  # VictoriaMetrics - 指标数据源
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    editable: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"
    isDefault: true