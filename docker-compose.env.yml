services:
  postgres:
    image: postgres:16-alpine
    container_name: miniblog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog-v4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "54321:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog-v4"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - miniblog-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: miniblog-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "Q6jAu8trwDEcJN7V"
    environment:
      REDIS_PASSWORD: Q6jAu8trwDEcJN7V
    ports:
      - "56379:6379"
    volumes:
      - ./data/redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a Q6jAu8trwDEcJN7V ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - miniblog-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  
networks:
  miniblog-net:
    driver: bridge

volumes:
  pgdata:
  redisdata: